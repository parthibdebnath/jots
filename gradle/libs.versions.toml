[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.09.00"
coroutines = "1.11.0"
serialization = "1.11.0"
profileinstaller = "1.4.1"
ink = "1.0.0"
jna = "5.17.0"
shizuku = "13.1.5"
